name: Deploy static site (PDF) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PAGES_ROOT: "site"      # folder to publish
  PDF_PATH: "report.pdf"  # expected inside PAGES_ROOT

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f "${PAGES_ROOT}/index.html" || (echo "Missing: ${PAGES_ROOT}/index.html" && exit 1)
          test -f "${PAGES_ROOT}/${PDF_PATH}" || (echo "Missing: ${PAGES_ROOT}/${PDF_PATH}" && exit 1)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_ROOT }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

